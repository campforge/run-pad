<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="7.5 3.5 85 94">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2e3480"/>
      <stop offset="100%" stop-color="#0c0d22"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4050b0"/>
      <stop offset="100%" stop-color="#242870"/>
    </linearGradient>
  </defs>

  <!-- Document y=5..96: stroke-width=2.2 extends ±1.1 → outer edges at y=3.9/97.1, x=7.9/92.1
       viewBox="7.5 3.5 85 94" crops exactly to those bounds → 100% height, no clip -->
  <path fill="url(#bg)" stroke="#5177fc" stroke-width="2.2" paint-order="stroke fill"
    d="M14,5 H69 L91,27 V92 Q91,96 87,96 H14 Q9,96 9,92 V9 Q9,5 14,5 Z"/>

  <!-- Fold flap -->
  <path fill="url(#fl)"
    d="M69,5 L91,27 H71 Q69,27 69,25 V5 Z"/>

  <!-- < -->
  <path fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
    d="M37,38 L27,50 L37,62"/>
  <!-- / -->
  <path fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"
    d="M45,64 L56,36"/>
  <!-- > -->
  <path fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
    d="M63,38 L73,50 L63,62"/>

  <!-- Play triangle -->
  <polygon fill="#00D4A4" points="67,74 67,92 85,83"/>
</svg>
