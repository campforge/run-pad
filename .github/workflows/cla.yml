name: CLA

# Contributor License Agreement check (CLA.md). On every pull request the bot checks that each
# commit author has accepted the agreement; an author accepts it once by posting the sentence below as
# a comment on the pull request, and "recheck" re-runs the check. Signatures are stored in
# signatures/version1/cla.json on the cla-signatures branch of this repository.
#
# pull_request_target runs this workflow from main with write access, but it never checks out or
# runs code from the pull request — the action only reads the PR's commit authors and comments.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # store signatures on the cla-signatures branch
  pull-requests: write   # comment on the pull request
  statuses: write        # set the CLA commit status

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: ✍️ CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Campforge/run-pad/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # The maintainer and bots do not sign.
          allowlist: hobobyte,dependabot[bot],github-actions[bot],copilot-swe-agent[bot]
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/Campforge/run-pad/blob/main/CLA.md)
            and accept it by posting the comment below. You only need to do this once.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have accepted the CLA. Thank you!
          lock-pullrequest-aftermerge: false
