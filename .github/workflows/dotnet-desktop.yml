name: CI

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Jobs that touch the draft release ask for contents: write themselves.
permissions:
  contents: read

# Pushes to main share one group so two release runs never write drafts at the same time (queued,
# not cancelled — a cancelled run would leave its draft half-filled). GitHub keeps at most one
# pending run per group, so a newer queued push replaces an older queued one. PR runs each get their
# own group (the run id) and stay fully parallel, as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && format('release-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  format:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      # Mock-REST tests for the draft-release helper the platform/release jobs run on push, and a
      # check that CHANGELOG.md describes the current <Version>. Run on every PR and push so a broken
      # helper or missing release notes are caught before main; Node 20 is the runtime
      # actions/github-script@v7 executes it with.
      - name: 🧲 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🧪 Test draft-release helper
        run: node --test .github/scripts/draft-release.test.js

      - name: 🧲 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 🔍 Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  build-windows:
    name: Build & Test (windows-latest)
    needs: format
    runs-on: windows-latest
    permissions:
      contents: write # creates/uploads to the draft release on push only
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
      version: ${{ steps.draft.outputs.version }}
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🧲 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # PRs pay per-minute for Windows runners (2x the Linux rate) — build-linux already runs the
      # FULL suite on every PR, so this lane skips only the expensive, redundant-on-this-OS parts:
      # Invoklet.Runtime.UI.Tests (215 headless-Avalonia tests, forced fully serial, since
      # AvaloniaTestFramework disables collection parallelism assembly-wide) and RealBuildTestCollection
      # (real `dotnet build` child-process spawns, ~5s floor each regardless of caching — measured directly).
      # Everything else — the actual cross-platform
      # risk surface (process/file-path handling, real dotnet-build behavior on THIS os specifically)
      # still runs here; only the parts whose outcome doesn't meaningfully vary by OS are skipped.
      # (Windows-only failures later brought parts of both back as the separate steps below.)
      - name: 🧪 Test (fast PR subset)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          for proj in tests/Invoklet.Format.MdRun.Tests tests/Invoklet.Runtime.Tests \
                      tests/Invoklet.Avalonia.HtmlRenderer.Tests tests/Invoklet.Cli.Tests tests/AvaloniaEdit.Tests \
                      tests/MarkView.Avalonia.Tests tests/MarkView.Avalonia.SyntaxHighlighting.Tests; do
            dotnet test "$proj" --no-build --configuration Release --verbosity normal
          done
          dotnet test tests/Invoklet.NonUI.Tests --no-build --configuration Release --verbosity normal \
            --filter "Category!=RealBuild"

      # RealBuild is skipped above, but ScriptCompilerTests'/ScriptPackageRestoreTests' cleanup (deleting
      # a script's output directory right after its process exits) failed on Windows only — a DLL the
      # script loaded still locked.
      # Run these two classes on PRs so the bounded retry
      # (TempDirectoryCleanup) is exercised here before main, not only in the full suite after merge.
      - name: 🧪 Test (RealBuild cleanup classes, Windows)
        if: github.event_name == 'pull_request'
        run: >
          dotnet test tests/Invoklet.NonUI.Tests --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName~Invoklet.Runtime.UI.Tests.ScriptCompilerTests|FullyQualifiedName~Invoklet.Runtime.UI.Tests.ScriptPackageRestoreTests"

      # The headless UI assembly is skipped above for cost, but its isolated-session setup failed
      # (Dispatcher.VerifyAccess in HeadlessUnitTestSession.EnsureIsolatedApplication) only in the
      # post-merge Windows run. The failure depends on what
      # a previous test left running, so the whole assembly runs here (a class filter changes the order).
      - name: 🧪 Test (Invoklet.Runtime.UI.Tests, Windows)
        if: github.event_name == 'pull_request'
        run: dotnet test tests/Invoklet.Runtime.UI.Tests --no-build --configuration Release --verbosity normal

      - name: 🧪 Test (full suite)
        if: github.event_name != 'pull_request'
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Release assets go straight to one draft GitHub Release (the Actions artifact quota is
      # exhausted). The draft is tagged after
      # Invoklet.csproj's <Version>, tied to this commit and run, and reused if this run is retried;
      # the `release` job publishes it only after every platform uploaded its archives. A version
      # that is already published fails here — bump <Version> before merging to cut a new release.
      # The version's section of CHANGELOG.md becomes the release notes.
      - name: 📝 Prepare draft release
        if: github.event_name == 'push'
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const helper = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/draft-release.js`);
            const version = helper.readVersionFromFile('src/main/Invoklet/Invoklet.csproj');
            const notes = helper.readReleaseNotesFromFile('CHANGELOG.md', version);
            const release = await helper.prepareDraft({ github, context, core, version, notes });
            core.setOutput('release-id', String(release.id));
            core.setOutput('version', version);

      # Release assets — only built on an actual merge to main, not on every PR. Ships both a portable
      # zip (unpack and run) and an MSI (Start Menu shortcut, uninstaller, upgrade-in-place on the
      # next version via the fixed UpgradeCode in installer/windows/Package.wxs).
      - name: 📦 Publish (win-x64)
        if: github.event_name == 'push'
        run: dotnet publish src/main/Invoklet/Invoklet.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: 🗜️ Archive (win-x64)
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath Invoklet-win-x64.zip

      # Pinned to WiX v5 specifically — v6+ added an Open Source Maintenance Fee EULA-acceptance gate
      # (harmless for a $0-revenue project, the fee itself only applies above $10k/year, but v5 avoids
      # needing any EULA-acceptance mechanism in CI at all — see installer/windows/Package.wxs).
      - name: 📦 Install WiX Toolset
        if: github.event_name == 'push'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2

      - name: 🧳 Build MSI (win-x64)
        if: github.event_name == 'push'
        env:
          # Belt-and-suspenders: WiX ships targeting an older net TFM than the SDK version this repo
          # pins — LatestMajor makes sure it still resolves against whatever .NET setup-dotnet just
          # installed rather than depending on a second, older runtime also being present.
          DOTNET_ROLL_FORWARD: LatestMajor
        run: >
          wix build installer/windows/Package.wxs -ext WixToolset.UI.wixext
          -d InvokletVersion=${{ steps.draft.outputs.version }} -d PublishDir=publish/win-x64
          -arch x64 -out Invoklet-win-x64.msi

      - name: ⬆️ Upload to draft release (win-x64)
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          RELEASE_VERSION: ${{ steps.draft.outputs.version }}
        with:
          script: |
            const helper = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/draft-release.js`);
            await helper.uploadAssets({
              github, context, core,
              releaseId: process.env.RELEASE_ID,
              version: process.env.RELEASE_VERSION,
              files: ['Invoklet-win-x64.zip', 'Invoklet-win-x64.msi'],
            });

  build-linux:
    name: Build & Test (ubuntu-latest)
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads to the draft release on push only
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🧲 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: 🧪 Test
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: 📊 Upload coverage
        uses: actions/upload-artifact@v4
        continue-on-error: true # a storage-quota/upload hiccup here is unrelated to code correctness — must not fail an otherwise-green PR
        with:
          name: coverage
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          # Uploaded on every PR/push, not just merges — the default 90-day retention has no real
          # value here (nothing re-reads an old run's coverage after a handful of days) and adds up
          # fast across a busy PR history. Release archives no longer go through Actions artifacts at
          # all (they were the bigger contributor to the storage-quota failure this was trimmed for).
          retention-days: 7

      # Release assets — only built on an actual merge to main, not on every PR. Ships a portable
      # tar.gz (unpack and run), an AppImage (single executable, no unpack/install step, shows up with
      # a real icon in file managers/app launchers that support it), and a real .deb (apt/dpkg-tracked
      # install, Start Menu-equivalent .desktop entry).
      - name: 📦 Publish (linux-x64)
        if: github.event_name == 'push'
        run: dotnet publish src/main/Invoklet/Invoklet.csproj -c Release -r linux-x64 --self-contained true -o publish/linux-x64

      - name: 🗜️ Archive (linux-x64)
        if: github.event_name == 'push'
        run: tar -czf Invoklet-linux-x64.tar.gz -C publish/linux-x64 .

      # Fixed releases with their checksums, so a release can be rebuilt with the tool it was built with: the
      # "continuous" build moves, and a change in it (stricter checks, 2026-10-29) failed a release build. The
      # tool downloads the latest AppImage runtime on its own, so the runtime is pinned too and handed to it.
      - name: ⬇️ Download appimagetool
        if: github.event_name == 'push'
        env:
          APPIMAGETOOL_VERSION: 1.9.1
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_RUNTIME_VERSION: 20251108
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" -o /tmp/appimagetool
          echo "${APPIMAGETOOL_SHA256}  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
          curl -fsSL "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64" -o /tmp/appimage-runtime
          echo "${APPIMAGE_RUNTIME_SHA256}  /tmp/appimage-runtime" | sha256sum -c -

      - name: 🧳 Bundle AppImage (linux-x64)
        if: github.event_name == 'push'
        env:
          APPIMAGETOOL: /tmp/appimagetool
          APPIMAGE_RUNTIME: /tmp/appimage-runtime
        run: bash scripts/make-linux-appimage.sh publish/linux-x64 dist

      # Version comes from build-windows (the one the draft is tagged with), not re-read here.
      - name: 🧳 Bundle .deb (linux-x64)
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
        run: bash scripts/make-linux-deb.sh publish/linux-x64 "$RELEASE_VERSION" dist

      - name: ⬆️ Upload to draft release (linux-x64)
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.build-windows.outputs.release-id }}
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
        with:
          script: |
            const helper = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/draft-release.js`);
            const version = process.env.RELEASE_VERSION;
            await helper.uploadAssets({
              github, context, core,
              releaseId: process.env.RELEASE_ID,
              version,
              files: ['Invoklet-linux-x64.tar.gz', 'dist/Invoklet-x86_64.AppImage', `dist/invoklet_${version}_amd64.deb`],
            });

  build-macos:
    name: Build & Test (macos-latest)
    # build-linux keeps the sequential order; build-windows supplies the draft release id/version.
    needs: [build-windows, build-linux]
    runs-on: macos-latest
    permissions:
      contents: write # uploads to the draft release on push only
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🧲 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # PRs pay per-minute for macOS runners (10x the Linux rate) — build-linux already runs the FULL
      # suite on every PR, so this lane skips only the expensive, redundant-on-this-OS parts: see
      # build-windows' own comment on the same step for the full rationale (Invoklet.Runtime.UI.Tests'
      # forced serialization + RealBuildTestCollection's real `dotnet build` floor cost).
      - name: 🧪 Test (fast PR subset)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          for proj in tests/Invoklet.Format.MdRun.Tests tests/Invoklet.Runtime.Tests \
                      tests/Invoklet.Avalonia.HtmlRenderer.Tests tests/Invoklet.Cli.Tests tests/AvaloniaEdit.Tests \
                      tests/MarkView.Avalonia.Tests tests/MarkView.Avalonia.SyntaxHighlighting.Tests; do
            dotnet test "$proj" --no-build --configuration Release --verbosity normal
          done
          dotnet test tests/Invoklet.NonUI.Tests --no-build --configuration Release --verbosity normal \
            --filter "Category!=RealBuild"

      - name: 🧪 Test (full suite)
        if: github.event_name != 'pull_request'
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Release assets — only built on an actual merge to main, not on every PR. Bundled as a real
      # Invoklet.app (Contents/MacOS + Info.plist + icon), not just a raw publish folder, so it's
      # double-clickable/shows up properly in Finder/Dock, then shipped as one disk image per
      # architecture (app + Applications symlink + first-launch ReadMe, native hdiutil). The bundle is
      # ad-hoc signed and verified by make-macos-app-bundle.sh
      # but has no Developer ID signature or notarization — the
      # ReadMe/README point to Gatekeeper's "Open Anyway" instead of any quarantine workaround.
      - name: 📦 Publish (osx-x64)
        if: github.event_name == 'push'
        run: dotnet publish src/main/Invoklet/Invoklet.csproj -c Release -r osx-x64 --self-contained true -o publish/osx-x64

      - name: 📦 Publish (osx-arm64)
        if: github.event_name == 'push'
        run: dotnet publish src/main/Invoklet/Invoklet.csproj -c Release -r osx-arm64 --self-contained true -o publish/osx-arm64

      - name: 🧳 Bundle .app (osx-x64)
        if: github.event_name == 'push'
        run: bash scripts/make-macos-app-bundle.sh publish/osx-x64 Invoklet-osx-x64

      - name: 🧳 Bundle .app (osx-arm64)
        if: github.event_name == 'push'
        run: bash scripts/make-macos-app-bundle.sh publish/osx-arm64 Invoklet-osx-arm64

      - name: 💿 Bundle DMG (osx-x64)
        if: github.event_name == 'push'
        run: bash scripts/make-macos-dmg.sh Invoklet-osx-x64/Invoklet.app Invoklet-osx-x64.dmg

      - name: 💿 Bundle DMG (osx-arm64)
        if: github.event_name == 'push'
        run: bash scripts/make-macos-dmg.sh Invoklet-osx-arm64/Invoklet.app Invoklet-osx-arm64.dmg

      - name: ⬆️ Upload to draft release (macOS)
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.build-windows.outputs.release-id }}
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
        with:
          script: |
            const helper = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/draft-release.js`);
            await helper.uploadAssets({
              github, context, core,
              releaseId: process.env.RELEASE_ID,
              version: process.env.RELEASE_VERSION,
              files: ['Invoklet-osx-x64.dmg', 'Invoklet-osx-arm64.dmg'],
            });

  # Runs only when all three platform jobs succeeded (default success() on needs). Verifies the
  # draft holds exactly the seven archives, fully uploaded, still owned by this commit and run, then
  # publishes it. Any failure leaves the draft unpublished for a retry ("Re-run failed jobs" keeps
  # the run id, so retried jobs reuse and fill the same draft). Unlike the previous
  # ncipollo/release-action setup (allowUpdates/replacesArtifacts), an already published version
  # is never updated in place — the run fails and asks for a <Version> bump instead.
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: 🚀 Publish draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.build-windows.outputs.release-id }}
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
        with:
          script: |
            const helper = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/draft-release.js`);
            await helper.publishDraft({
              github, context, core,
              releaseId: process.env.RELEASE_ID,
              version: process.env.RELEASE_VERSION,
            });
