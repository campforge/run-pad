name: CI

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  format:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🧲 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 🔍 Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  build-windows:
    name: Build & Test (windows-latest)
    needs: format
    runs-on: windows-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🧲 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # PRs pay per-minute for Windows runners (2x the Linux rate) — build-linux already runs the
      # FULL suite on every PR, so this lane skips only the expensive, redundant-on-this-OS parts:
      # RunPad.Runtime.UI.Tests (215 headless-Avalonia tests, forced fully serial — see docs/ARCHITECTURE.md on
      # AvaloniaTestFramework disabling collection parallelism assembly-wide) and RealBuildTestCollection
      # (real `dotnet build` child-process spawns, ~5s floor each regardless of caching — measured
      # directly, see проход "минимизация CI-времени"). Everything else — the actual cross-platform
      # risk surface (process/file-path handling, real dotnet-build behavior on THIS os specifically)
      # still runs here; only the parts whose outcome doesn't meaningfully vary by OS are skipped.
      # (Windows-only failures later brought parts of both back as the separate steps below.)
      - name: 🧪 Test (fast PR subset)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          for proj in tests/RunPad.Format.RPad.Tests tests/RunPad.Runtime.Tests \
                      tests/RunPad.Avalonia.HtmlRenderer.Tests tests/RunPad.Cli.Tests tests/AvaloniaEdit.Tests; do
            dotnet test "$proj" --no-build --configuration Release --verbosity normal
          done
          dotnet test tests/RunPad.NonUI.Tests --no-build --configuration Release --verbosity normal \
            --filter "Category!=RealBuild"

      # RealBuild is skipped above, but ScriptCompilerTests'/ScriptPackageRestoreTests' cleanup (deleting
      # a script's output directory right after its process exits) failed on Windows only — a DLL the
      # script loaded still locked, see docs/handoffs/release-windows-checks.md and
      # release-test-isolation.md. Run these two classes on PRs so the bounded retry
      # (TempDirectoryCleanup) is exercised here before main, not only in the full suite after merge.
      - name: 🧪 Test (RealBuild cleanup classes, Windows)
        if: github.event_name == 'pull_request'
        run: >
          dotnet test tests/RunPad.NonUI.Tests --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName~RunPad.Runtime.UI.Tests.ScriptCompilerTests|FullyQualifiedName~RunPad.Runtime.UI.Tests.ScriptPackageRestoreTests"

      # The headless UI assembly is skipped above for cost, but its isolated-session setup failed
      # (Dispatcher.VerifyAccess in HeadlessUnitTestSession.EnsureIsolatedApplication) only in the
      # post-merge Windows run, see docs/handoffs/release-test-isolation.md. The failure depends on what
      # a previous test left running, so the whole assembly runs here (a class filter changes the order).
      - name: 🧪 Test (RunPad.Runtime.UI.Tests, Windows)
        if: github.event_name == 'pull_request'
        run: dotnet test tests/RunPad.Runtime.UI.Tests --no-build --configuration Release --verbosity normal

      - name: 🧪 Test (full suite)
        if: github.event_name != 'pull_request'
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Release assets — only built on an actual merge to main, not on every PR. Ships both a portable
      # zip (unpack and run) and an MSI (Start Menu shortcut, uninstaller, upgrade-in-place on the
      # next version via the fixed UpgradeCode in installer/windows/Package.wxs).
      - name: 📦 Publish (win-x64)
        if: github.event_name == 'push'
        run: dotnet publish src/main/RunPad/RunPad.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: 🗜️ Archive (win-x64)
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath RunPad-win-x64.zip

      - name: 🔎 Read version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/main/RunPad/RunPad.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Pinned to WiX v5 specifically — v6+ added an Open Source Maintenance Fee EULA-acceptance gate
      # (harmless for a $0-revenue project, the fee itself only applies above $10k/year, but v5 avoids
      # needing any EULA-acceptance mechanism in CI at all — see installer/windows/Package.wxs).
      - name: 📦 Install WiX Toolset
        if: github.event_name == 'push'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2

      - name: 🧳 Build MSI (win-x64)
        if: github.event_name == 'push'
        env:
          # Belt-and-suspenders: WiX ships targeting an older net TFM than the SDK version this repo
          # pins — LatestMajor makes sure it still resolves against whatever .NET setup-dotnet just
          # installed rather than depending on a second, older runtime also being present.
          DOTNET_ROLL_FORWARD: LatestMajor
        run: >
          wix build installer/windows/Package.wxs -ext WixToolset.UI.wixext
          -d RunPadVersion=${{ steps.version.outputs.version }} -d PublishDir=publish/win-x64
          -arch x64 -out RunPad-win-x64.msi

      - name: ⬆️ Upload release artifact (win-x64 zip)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: RunPad-win-x64.zip
          # A self-contained publish zip is ~90MB (measured directly) — this copy only exists to hand
          # off to the `release` job later in the SAME workflow run; the permanent, actually-downloaded
          # copy is the one ncipollo/release-action attaches to the GitHub Release. No reason to keep
          # this intermediate copy for the default 90 days — three platforms' worth of that per merge
          # to main is what exhausted the private-repo Actions storage quota ("Failed to CreateArtifact:
          # Artifact storage quota has been hit").
          retention-days: 1

      - name: ⬆️ Upload release artifact (win-x64 MSI)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-win-x64-msi
          path: RunPad-win-x64.msi
          retention-days: 1

  build-linux:
    name: Build & Test (ubuntu-latest)
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🧲 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: 🧪 Test
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: 📊 Upload coverage
        uses: actions/upload-artifact@v4
        continue-on-error: true # a storage-quota/upload hiccup here is unrelated to code correctness — must not fail an otherwise-green PR
        with:
          name: coverage
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          # Uploaded on every PR/push, not just merges — the default 90-day retention has no real
          # value here (nothing re-reads an old run's coverage after a handful of days) and adds up
          # fast across a busy PR history. See the release-artifact uploads below for the bigger
          # contributor to the storage-quota failure this was trimmed for.
          retention-days: 7

      # Release assets — only built on an actual merge to main, not on every PR. Ships a portable
      # tar.gz (unpack and run), an AppImage (single executable, no unpack/install step, shows up with
      # a real icon in file managers/app launchers that support it), and a real .deb (apt/dpkg-tracked
      # install, Start Menu-equivalent .desktop entry).
      - name: 📦 Publish (linux-x64)
        if: github.event_name == 'push'
        run: dotnet publish src/main/RunPad/RunPad.csproj -c Release -r linux-x64 --self-contained true -o publish/linux-x64

      - name: 🗜️ Archive (linux-x64)
        if: github.event_name == 'push'
        run: tar -czf RunPad-linux-x64.tar.gz -C publish/linux-x64 .

      - name: ⬇️ Download appimagetool
        if: github.event_name == 'push'
        run: |
          curl -sL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: 🧳 Bundle AppImage (linux-x64)
        if: github.event_name == 'push'
        env:
          APPIMAGETOOL: /tmp/appimagetool
        run: bash scripts/make-linux-appimage.sh publish/linux-x64 dist

      - name: 🔎 Read version
        if: github.event_name == 'push'
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/main/RunPad/RunPad.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🧳 Bundle .deb (linux-x64)
        if: github.event_name == 'push'
        run: bash scripts/make-linux-deb.sh publish/linux-x64 ${{ steps.version.outputs.version }} dist

      - name: ⬆️ Upload release artifact (linux-x64 tar.gz)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: RunPad-linux-x64.tar.gz
          # See release-win-x64's own upload step for why this is trimmed to 1 day.
          retention-days: 1

      - name: ⬆️ Upload release artifact (linux-x64 AppImage)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64-appimage
          path: dist/RunPad-x86_64.AppImage

      - name: ⬆️ Upload release artifact (linux-x64 deb)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64-deb
          path: dist/runpad_${{ steps.version.outputs.version }}_amd64.deb

  build-macos:
    name: Build & Test (macos-latest)
    needs: build-linux
    runs-on: macos-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🧲 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # PRs pay per-minute for macOS runners (10x the Linux rate) — build-linux already runs the FULL
      # suite on every PR, so this lane skips only the expensive, redundant-on-this-OS parts: see
      # build-windows' own comment on the same step for the full rationale (RunPad.Runtime.UI.Tests'
      # forced serialization + RealBuildTestCollection's real `dotnet build` floor cost).
      - name: 🧪 Test (fast PR subset)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -e
          for proj in tests/RunPad.Format.RPad.Tests tests/RunPad.Runtime.Tests \
                      tests/RunPad.Avalonia.HtmlRenderer.Tests tests/RunPad.Cli.Tests tests/AvaloniaEdit.Tests; do
            dotnet test "$proj" --no-build --configuration Release --verbosity normal
          done
          dotnet test tests/RunPad.NonUI.Tests --no-build --configuration Release --verbosity normal \
            --filter "Category!=RealBuild"

      - name: 🧪 Test (full suite)
        if: github.event_name != 'pull_request'
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Release assets — only built on an actual merge to main, not on every PR. Bundled as a real
      # RunPad.app (Contents/MacOS + Info.plist + icon), not just a raw publish folder, so it's
      # double-clickable/shows up properly in Finder/Dock — unsigned/not notarized (see TODO.md
      # проход 136), so the README documents the `xattr -cr` step users need before first launch.
      - name: 📦 Publish (osx-x64)
        if: github.event_name == 'push'
        run: dotnet publish src/main/RunPad/RunPad.csproj -c Release -r osx-x64 --self-contained true -o publish/osx-x64

      - name: 📦 Publish (osx-arm64)
        if: github.event_name == 'push'
        run: dotnet publish src/main/RunPad/RunPad.csproj -c Release -r osx-arm64 --self-contained true -o publish/osx-arm64

      - name: 🧳 Bundle .app (osx-x64)
        if: github.event_name == 'push'
        run: bash scripts/make-macos-app-bundle.sh publish/osx-x64 RunPad-osx-x64

      - name: 🧳 Bundle .app (osx-arm64)
        if: github.event_name == 'push'
        run: bash scripts/make-macos-app-bundle.sh publish/osx-arm64 RunPad-osx-arm64

      - name: 🗜️ Archive (osx-x64)
        if: github.event_name == 'push'
        run: tar -czf RunPad-osx-x64.tar.gz -C RunPad-osx-x64 RunPad.app

      - name: 🗜️ Archive (osx-arm64)
        if: github.event_name == 'push'
        run: tar -czf RunPad-osx-arm64.tar.gz -C RunPad-osx-arm64 RunPad.app

      - name: ⬆️ Upload release artifact (osx-x64)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-osx-x64
          path: RunPad-osx-x64.tar.gz
          # See release-win-x64's own upload step for why this is trimmed to 1 day.
          retention-days: 1

      - name: ⬆️ Upload release artifact (osx-arm64)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-osx-arm64
          path: RunPad-osx-arm64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: ⬇️ Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # Tag/release are named after RunPad.csproj's <Version> — bump it before merging to main
      # to cut a new release; otherwise this updates the existing release for that version in
      # place (replacing its seven archives) rather than failing or piling up duplicates.
      - name: 🔎 Read version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/main/RunPad/RunPad.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: RunPad v${{ steps.version.outputs.version }}
          artifacts: artifacts/*
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
