name: Docs

# User documentation (mkdocs.yml + docs/site) → GitHub Pages at https://coddwrench.github.io/run-pad/.
# Pull requests only build and check the site; pushes to main (and manual runs on main) also
# deploy it. Maintainer setup: docs/GITHUB-PAGES.md.

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [ "main" ]
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time, never cancelled half-way; PR builds get their own group and a
# newer push to the same PR cancels the older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://coddwrench.github.io/run-pad/

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: 📦 Install MkDocs
        run: python -m pip install -r requirements-docs.txt

      - name: 🏗️ Build site (strict)
        run: mkdocs build --strict

      - name: 🔗 Check links, anchors and assets
        run: python scripts/docs/check_site_links.py site --site-url "$SITE_URL"

      - name: 📤 Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5

      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
